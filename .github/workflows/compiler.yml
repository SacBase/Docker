name: Build and publish sac2c image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 6'

env:
  REGISTRY_IMAGE: sacbase/sac-compiler

# https://docs.docker.com/build/ci/github-actions/multi-platform/
jobs:
  build:
    strategy:
      fail-fast: false
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job
      matrix:
        include:
          - variant: cpu
            platform: amd64
            runner: ubuntu-22.04
          - variant: cpu
            platform: arm64
            runner: ubuntu-22.04-arm
          - variant: cuda
            platform: amd64
            runner: ubuntu-22.04
          - variant: cuda
            platform: arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare
        run: |
          platform=linux/${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # https://github.com/tonistiigi/binfmt/issues/215
          platforms: ${{ matrix.platform }}
          image: tonistiigi/binfmt:qemu-v9.2.0
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.platform }}
          file: Dockerfile.compiler
          build-args: |
            VARIANT=${{ matrix.variant }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ matrix.variant == 'cpu' && 'latest' || 'cuda' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    strategy:
      matrix:
        variant:
          - cpu
          - cuda

    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create weekly tag
        run: |
          echo "WEEKLY_TAG=$(date -u +'%G-%V')" >> $GITHUB_ENV

      - name: Set image tags
        run: |
          if [ "${{ matrix.variant }}" = "cpu" ]; then
            echo "IMAGE_TAG=${{ env.REGISTRY_IMAGE }}" >> $GITHUB_ENV
            echo "WEEKLY_IMAGE_TAG=${{ env.REGISTRY_IMAGE }}:${WEEKLY_TAG}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ env.REGISTRY_IMAGE }}:cuda" >> $GITHUB_ENV
            echo "WEEKLY_IMAGE_TAG=${{ env.REGISTRY_IMAGE }}:cuda-${WEEKLY_TAG}" >> $GITHUB_ENV
          fi

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_TAG}" \
            -t "${WEEKLY_IMAGE_TAG}" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE_TAG}"
